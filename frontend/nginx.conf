server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames (index-<hash>.js, Trends-<hash>.js), so
    # these are safe to cache indefinitely. A 404 here must stay a 404 rather than
    # fall through to index.html: a missing chunk that silently returns HTML makes
    # React.lazy fail with an opaque MIME/parse error instead of a clear 404.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app shell must never be cached, or a redeploy keeps serving an
    # index.html that references chunk hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app. /trends and /reports/12 are client-side routes with no
    # file behind them, so anything unmatched falls back to the shell. Without
    # this, opening or refreshing a deep link is a hard 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
